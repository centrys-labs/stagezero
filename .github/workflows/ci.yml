name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, chore/migrate-frontend-to-bun]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go build ./...
        working-directory: api
      - run: go vet ./...
        working-directory: api
      - run: go test ./...
        working-directory: api
      - run: go test -race ./...
        working-directory: api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run --cwd frontend check
      - run: bun run lint
      - run: bun run build:web
      - run: bun test scripts/setup.test.ts
      - name: Install pinned Go generators
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.6.0
      - run: bun run generate
      - name: Check for generated code drift
        run: |
          if ! git diff --exit-code -- api/gen/api.gen.go api/db/sqlcgen frontend/src/lib/api/v1.d.ts; then
            echo "::error::Generated code is out of date. Run 'bun run generate' and commit the result."
            exit 1
          fi
