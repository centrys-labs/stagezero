name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.6.0
      - name: Generate backend types from OpenAPI spec
        run: oapi-codegen -config oapi-codegen.yaml openapi.yaml
        working-directory: api
      - name: Check for oapi-codegen drift
        run: |
          if ! git diff --exit-code api/gen/api.gen.go; then
            echo "::error::Generated backend types are out of date. Run 'make -C api oapi' and commit the result."
            exit 1
          fi
      - run: go build ./...
        working-directory: api
      - run: go vet ./...
        working-directory: api
      - run: go test ./...
        working-directory: api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run check
        working-directory: frontend
      - run: bun run lint
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
      - run: bun run generate:api
        working-directory: frontend
      - name: Check for OpenAPI type drift
        run: |
          if ! git diff --exit-code frontend/src/lib/api/v1.d.ts; then
            echo "::error::Generated OpenAPI types are out of date. Run 'bun run generate:api' and commit the result."
            exit 1
          fi
